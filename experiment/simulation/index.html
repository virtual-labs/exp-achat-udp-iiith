<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/main.css" />

    <title>PING-PONG</title>
  </head>

  <body class="body">
    <!-- <script src="./js/nav.js" id="navbar-1"></script> -->
    <div style="display: flex; flex-direction: row;">
      <button class="btn btn-outline-info" type="button" data-toggle="collapse" data-target="#instruction-data" aria-expanded="false" aria-controls="instruction-data">Instructions</button>
      <div id="timer-top" style="height: 30px; font-size: 25px; margin-bottom: 5px; font-family: monospace; text-align: center;">
        Timer: 
        --
      </div>
    </div>
      <div class="collapse" id="instruction-data" style="margin-top: 2%;">
          <div class="card card-body">
              <ul>
                  <li>Click on the <b>PING</b> button to send a PING packet</li>
                  <li>On succesfully receiving a <b>PING</b> packet, the Receiver will send a <b>PONG</b> packet</li>
                  <li>The RTT is <b>4 seconds</b> of the timer</li>
                  <li><b><u>Task</u>:</b> Receive <b>3 PONG</b> packets from Receiver</li>
              </ul>
          </div>
        </div>
    
    <div class="content" style="display: grid; grid-template-columns: 2fr 3fr 3fr;">
        <div style="width: 60%; align-content: center; " class="button-div">
            <h5>Send Message</h5>
            <button type="button" class="btn-circle" onclick="p1_buttonPress()" >PING</button>
            <p>
              <button type="button" id="toggle-canvas" class=" btn-primary" style="border-radius: 25%; margin: 20px;" >Toggle Canvas</button>
            </p>
        </div>
        <!-- <div id="canvas"></div> -->

        <div style="display: grid; grid-template-rows: 10fr 1fr; height: 450px" class="canvas-div">
          <div id="canvas-box" style="display: grid; grid-template-columns: 1fr 10fr; width: 450px; overflow-y:scroll; scrollbar-gutter: stable; height: 450px; margin-top: 10px; justify-self: end">
              
            <div id="ray-name" style="flex: 1; width: 60px; display: flex; flex-direction: column; font-family: monospace;"></div>
  
            <div id="canvas" style="width: 360px;"></div>
  
            <!-- <div></div> -->
          </div>

        </div>



        <div id="status-box" style="flex: 1; left: 50%; margin-top: 5px;">
          <div id="timer" style="width: 450px; height: 30px; font-size: 25px; margin-bottom: 5px; font-family: monospace; text-align: center;">
            Timer: 
            --
          </div>

          <div id="Log-span" style=" width: 450px; ">
            <h5 style="text-align: center; border-top-right-radius: 20px; border-top-left-radius: 20px; background-color: rgb(160, 212, 255) !important; margin: 0;">Communication log: </h5>
            <div style="overflow-y: scroll; height:400px; background-color: rgb(160, 212, 255) !important; " id="log-box">
              <ol id="log"></ol>
            </div>
          </div>
        </div>
    <br><br>
  </body>

  <script src="./js/main.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const ray_name = document.getElementById("ray-name");
    const toggle_canvas = document.getElementById("toggle-canvas");

    canvas.style.display = "none";
    ray_name.style.display = "none";

    toggle_canvas.addEventListener("click", () => {
      if(canvas.style.display === "none"){
        canvas.style.display = "block";
        ray_name.style.display = "block";
      } else {
        canvas.style.display = "none";
        ray_name.style.display = "none";
      }
    })
  </script>
</html>
